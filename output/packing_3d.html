
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Trolley Tetris - 3D</title>

        <style>
            html, body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #202020;
            }

            canvas {
                display: block;
                width: 100%;
                height: 100%;
            }

            #info {
                position: absolute;
                top: 15px;
                left: 15px;
                z-index: 10;
                padding: 10px 14px;
                color: white;
                background: rgba(0, 0, 0, 0.7);
                font-family: Arial, sans-serif;
            }

            #controls {
                position: absolute;
                top: 15px;
                left: 15px;
                z-index: 10;
                font-family: Arial, sans-serif;
            }

            #viewSelect {
                padding: 8px 12px;
                font-size: 15px;
                color: white;
                background: #303030;
                border: 1px solid #666;
                border-radius: 4px;
            }

            #info {
                position: absolute;
                top: 60px;
                left: 15px;
                z-index: 10;
                padding: 10px 14px;
                color: white;
                background: rgba(0, 0, 0, 0.7);
                font-family: Arial, sans-serif;
                max-width: 400px;
            }
        </style>
    </head>

    <body>

    <div id="controls">
        <select id="viewSelect"></select>
    </div>

    <div id="info">Loading...</div>
    <canvas id="canvas"></canvas>

    <script>
    const DATA = {"baskets": [{"number": 1, "width": 100, "length": 70, "height": 50, "placements": [{"x": 0, "y": 0, "z": 0, "width": 84, "length": 61, "height": 6, "name": "ÄNGSJÖN", "item_number": "70535089"}, {"x": 0, "y": 0, "z": 6, "width": 84, "length": 61, "height": 6, "name": "ÄNGSJÖN", "item_number": "70535089"}, {"x": 0, "y": 0, "z": 12, "width": 87, "length": 55, "height": 18, "name": "ORRSJÖN", "item_number": "90545073"}, {"x": 0, "y": 0, "z": 30, "width": 31, "length": 45, "height": 8, "name": "RÄNNILEN", "item_number": "20554532"}, {"x": 31, "y": 0, "z": 30, "width": 18, "length": 35, "height": 6, "name": "DALSKÄR", "item_number": "30532525"}, {"x": 49, "y": 0, "z": 30, "width": 18, "length": 45, "height": 18, "name": "SANDGRÄSMAL", "item_number": "90608367"}, {"x": 0, "y": 0, "z": 38, "width": 22, "length": 68, "height": 10, "name": "LURÖY", "item_number": "50278726"}]}, {"number": 2, "width": 100, "length": 70, "height": 50, "placements": [{"x": 0, "y": 0, "z": 0, "width": 98, "length": 62, "height": 8, "name": "MALM", "item_number": "10261836"}, {"x": 0, "y": 0, "z": 8, "width": 98, "length": 62, "height": 8, "name": "MALM", "item_number": "10261836"}]}], "unplaced": [{"name": "MALM", "item_number": "80261102"}, {"name": "MALM", "item_number": "80261102"}, {"name": "SKORVA", "item_number": "90124534"}, {"name": "VÅGSTRANDA", "item_number": "90450786"}, {"name": "VÅGSTRANDA", "item_number": "90450786"}]};

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    let currentView = {
        type: "basket",
        index: 0
    };

    const viewSelect = document.getElementById("viewSelect");
    const info = document.getElementById("info");

    function getCurrentBasket() {
        return DATA.baskets[currentView.index];
    }


    function updateViewSelector() {
        viewSelect.innerHTML = "";

        DATA.baskets.forEach(function(basket, index) {
            const option = document.createElement("option");

            option.value = index;
            option.textContent =
                "Basket " +
                basket.number +
                " (" +
                basket.placements.length +
                " packages)";

            viewSelect.appendChild(option);
        });


        if (DATA.unplaced.length > 0) {
            const option = document.createElement("option");

            option.value = "unplaced";
            option.textContent =
                "Unplaced (" +
                DATA.unplaced.length +
                " items)";

            viewSelect.appendChild(option);
        }


        viewSelect.value =
            currentView.type === "unplaced"
                ? "unplaced"
                : String(currentView.index);
    }


    viewSelect.addEventListener("change", function() {

        if (this.value === "unplaced") {
            currentView = {
                type: "unplaced",
                index: -1
            };
        } else {
            currentView = {
                type: "basket",
                index: Number(this.value)
            };
        }

        draw();
    });


    updateViewSelector();


    // ============================================================
    // Projection
    // ============================================================

    const MARGIN = 100;

    let SCALE = 1;
    let OFFSET_X = 0;
    let OFFSET_Y = 0;


    function projectRaw(x, y, z) {
        return {
            x: x - y,
            y: (x + y) * 0.5 - z
        };
    }


    function project(x, y, z) {
        const raw = projectRaw(x, y, z);

        return {
            x: OFFSET_X + raw.x * SCALE,
            y: OFFSET_Y + raw.y * SCALE
        };
    }


    function calculateView() {

        const basket = getCurrentBasket();
        const points = [
            projectRaw(0, 0, 0),
            projectRaw(basket.width, 0, 0),
            projectRaw(0, basket.length, 0),
            projectRaw(basket.width, basket.length, 0),

            projectRaw(0, 0, basket.height),
            projectRaw(basket.width, 0, basket.height),
            projectRaw(0, basket.length, basket.height),
            projectRaw(
                basket.width,
                basket.length,
                basket.height
            )
        ];

        const minX = Math.min(...points.map(p => p.x));
        const maxX = Math.max(...points.map(p => p.x));
        const minY = Math.min(...points.map(p => p.y));
        const maxY = Math.max(...points.map(p => p.y));

        const sceneWidth = maxX - minX;
        const sceneHeight = maxY - minY;

        SCALE = Math.min(
            (canvas.width - MARGIN * 2) / sceneWidth,
            (canvas.height - MARGIN * 2) / sceneHeight
        );

        OFFSET_X =
            (canvas.width - sceneWidth * SCALE) / 2 -
            minX * SCALE;

        OFFSET_Y =
            (canvas.height - sceneHeight * SCALE) / 2 -
            minY * SCALE;
    }


    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        draw();
    }

    window.addEventListener("resize", resize);


    // ============================================================
    // Lines
    // ============================================================

    function drawLine(a, b) {
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
    }


    // ============================================================
    // Package rendering
    // ============================================================

    function drawBox(
        x,
        y,
        z,
        width,
        length,
        height,
        colour
    ) {
        const p000 = project(x, y, z);

        const p100 = project(
            x + width,
            y,
            z
        );

        const p010 = project(
            x,
            y + length,
            z
        );

        const p110 = project(
            x + width,
            y + length,
            z
        );

        const p001 = project(
            x,
            y,
            z + height
        );

        const p101 = project(
            x + width,
            y,
            z + height
        );

        const p011 = project(
            x,
            y + length,
            z + height
        );

        const p111 = project(
            x + width,
            y + length,
            z + height
        );


        function face(points, alpha) {
            ctx.beginPath();

            ctx.moveTo(
                points[0].x,
                points[0].y
            );

            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(
                    points[i].x,
                    points[i].y
                );
            }

            ctx.closePath();

            ctx.globalAlpha = alpha;
            ctx.fillStyle = colour;
            ctx.fill();

            ctx.globalAlpha = 1;

            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 1;
            ctx.stroke();
        }


        // Bottom

        face(
            [
                p000,
                p100,
                p110,
                p010
            ],
            0.35
        );


        // XZ @ -Y

        face(
            [
                p000,
                p100,
                p101,
                p001
            ],
            0.75
        );


        // YZ @ +X

        face(
            [
                p100,
                p110,
                p111,
                p101
            ],
            0.65
        );


        // XZ @ +Y

        face(
            [
                p010,
                p110,
                p111,
                p011
            ],
            0.45
        );


        // YZ @ -X

        face(
            [
                p000,
                p010,
                p011,
                p001
            ],
            0.55
        );


        // Top

        face(
            [
                p001,
                p101,
                p111,
                p011
            ],
            0.9
        );
    }


    // ============================================================
    // Basket vertices
    // ============================================================

    function getBasketPoints() {
        const basket = getCurrentBasket();
        return {
            p000: project(0, 0, 0),

            p100: project(
                basket.width,
                0,
                0
            ),

            p010: project(
                0,
                basket.length,
                0
            ),

            p110: project(
                basket.width,
                basket.length,
                0
            ),

            p001: project(
                0,
                0,
                basket.height
            ),

            p101: project(
                basket.width,
                0,
                basket.height
            ),

            p011: project(
                0,
                basket.length,
                basket.height
            ),

            p111: project(
                basket.width,
                basket.length,
                basket.height
            )
        };
    }


    // ============================================================
    // Basket BACK edges
    //
    // These are NOT part of:
    //
    //     YZ @ -X
    //     XZ @ -Y
    //     XY @ +Z
    //
    // Therefore they are drawn BEFORE the packages.
    //
    //     p100 -> p110
    //     p010 -> p110
    //     p110 -> p111
    // ============================================================

    function drawBasketBackEdges() {

        const p = getBasketPoints();

        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.globalAlpha = 1;

        // --------------------------------------------------------
        // XZ @ +Y
        //
        // p000 -> p010
        // p010 -> p011
        // p011 -> p001
        // p001 -> p000
        // --------------------------------------------------------

        drawLine(p.p000, p.p010);
        drawLine(p.p010, p.p011);
        drawLine(p.p011, p.p001);
        drawLine(p.p001, p.p000);

        // --------------------------------------------------------
        // YZ @ +X
        //
        // p000 -> p100
        // p100 -> p101
        // p101 -> p001
        //
        // p001 -> p000 already drawn above.
        // --------------------------------------------------------

        drawLine(p.p000, p.p100);
        drawLine(p.p100, p.p101);
        drawLine(p.p101, p.p001);

        // Duplicate, ignore em cos fucking ChatGPT doesn't know shit
        //drawLine(p.p000, p.p010);
        //drawLine(p.p010, p.p011);
        //drawLine(p.p011, p.p001);
        //drawLine(p.p001, p.p000);
    }


    // ============================================================
    // Basket FOREGROUND edges
    //
    // EXACTLY the edges belonging to:
    //
    //     YZ @ -X
    //     XZ @ -Y
    //     XY @ +Z
    //
    // Shared edges are drawn once.
    // ============================================================

    function drawBasketFrontEdges() {
        const p = getBasketPoints();

        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.globalAlpha = 1;


        // --------------------------------------------------------
        // XY @ +Z
        //
        // p001 -> p101
        // p101 -> p111
        // p111 -> p011
        //
        // p011 -> p001 already drawn above.
        // --------------------------------------------------------

        drawLine(p.p001, p.p101);
        drawLine(p.p101, p.p111);
        drawLine(p.p111, p.p011);

        // --------------------------------------------------------
        // XZ @ -Y
        // bottom, 
        // --------------------------------------------------------
        drawLine(p.p100, p.p110);

        // --------------------------------------------------------
        // YZ @ -X
        // bottom, right
        // --------------------------------------------------------
        drawLine(p.p010, p.p110);
        drawLine(p.p110, p.p111);
    }


    // ============================================================
    // XYZ reference
    // ============================================================

    function drawAxes() {
        const origin = {
            x: 100,
            y: canvas.height - 100
        };

        const scale = 60;

        const axes = [
            {
                name: "X",
                x: scale,
                y: -scale * 0.5
            },
            {
                name: "Y",
                x: -scale,
                y: -scale * 0.5
            },
            {
                name: "Z",
                x: 0,
                y: -scale
            }
        ];


        ctx.save();

        ctx.lineWidth = 3;
        ctx.font = "bold 18px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";


        axes.forEach(function(axis) {
            const end = {
                x: origin.x + axis.x,
                y: origin.y + axis.y
            };

            ctx.beginPath();

            ctx.moveTo(
                origin.x,
                origin.y
            );

            ctx.lineTo(
                end.x,
                end.y
            );

            ctx.stroke();


            const angle = Math.atan2(
                axis.y,
                axis.x
            );

            const arrowSize = 12;


            ctx.beginPath();

            ctx.moveTo(
                end.x,
                end.y
            );

            ctx.lineTo(
                end.x -
                    arrowSize *
                    Math.cos(angle - Math.PI / 6),

                end.y -
                    arrowSize *
                    Math.sin(angle - Math.PI / 6)
            );

            ctx.lineTo(
                end.x -
                    arrowSize *
                    Math.cos(angle + Math.PI / 6),

                end.y -
                    arrowSize *
                    Math.sin(angle + Math.PI / 6)
            );

            ctx.closePath();

            ctx.fill();


            ctx.fillText(
                axis.name,
                end.x + Math.cos(angle) * 20,
                end.y + Math.sin(angle) * 20
            );
        });


        ctx.beginPath();

        ctx.arc(
            origin.x,
            origin.y,
            4,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.restore();
    }


    // ============================================================
    // Main rendering
    // ============================================================

    function updateInfo() {

        if (currentView.type === "unplaced") {
            info.textContent =
                "Unplaced — " +
                DATA.unplaced.length +
                " items";

            return;
        }


        const basket = getCurrentBasket();

        info.textContent =
            "Basket " +
            basket.number +
            " — " +
            basket.placements.length +
            " packages";
    }


    function drawUnplaced() {

        info.textContent =
            "Unplaced — " +
            DATA.unplaced.length +
            " items";


        ctx.save();

        ctx.fillStyle = "#ffffff";
        ctx.font = "20px Arial";
        ctx.textAlign = "left";
        ctx.textBaseline = "top";


        let y = 100;

        DATA.unplaced.forEach(function(item, index) {

            const number =
                item.item_number !== undefined
                    ? item.item_number
                    : "";

            const name =
                item.name !== undefined
                    ? item.name
                    : "Unnamed item";

            ctx.fillText(
                number + " — " + name,
                60,
                y
            );

            y += 32;
        });


        if (DATA.unplaced.length === 0) {

            ctx.fillText(
                "No unplaced items.",
                60,
                y
            );
        }


        ctx.restore();
    }

    function draw() {
        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        if (currentView.type === "unplaced") {
            drawUnplaced();
            return;
        }

        const basket = getCurrentBasket();
        updateInfo();

        calculateView();


        // ========================================================
        // 1. BACK BASKET EDGES
        // ========================================================

        drawBasketBackEdges();



        // ========================================================
        // 2. PACKAGES
        // ========================================================

        const colours = [
            "#4dabf7",
            "#ff6b6b",
            "#51cf66",
            "#ffd43b",
            "#cc5de8",
            "#20c997",
            "#ff922b"
        ];


        const placements = [
            ...basket.placements
        ];


        placements.sort(function(a, b) {
            return (
                (a.z + a.x + a.y) -
                (b.z + b.x + b.y)
            );
        });


        placements.forEach(function(placement, index) {
            drawBox(
                placement.x,
                placement.y,
                placement.z,
                placement.width,
                placement.length,
                placement.height,
                colours[index % colours.length]
            );
        });


        // ========================================================
        // 3. FRONT / SIDE / TOP BASKET EDGES
        //
        // YZ @ -X
        // XZ @ -Y
        // XY @ +Z
        // ========================================================

        drawBasketFrontEdges();


        // ========================================================
        // 4. XYZ AXES
        // ========================================================

        drawAxes();
    }


    resize();
    </script>

    </body>
    </html>
